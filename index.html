<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shifoat Academy</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --ink:#1c2430;
    --ink-soft:#5b6472;
    --line:#e3e7ee;
    --brand:#2f6fed;
    --brand-ink:#ffffff;
    --brand-soft:#eaf0ff;
    --danger:#e0483e;
    --danger-soft:#fdeceb;
    --ok:#1f9d55;
    --ok-soft:#e9f9ef;
    --radius:12px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---- generic ---- */
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:10px 16px;background:var(--brand);color:var(--brand-ink);font-weight:600;transition:opacity .15s;}
  button:hover{opacity:.88;}
  button.secondary{background:var(--brand-soft);color:var(--brand);}
  button.ghost{background:transparent;color:var(--ink-soft);padding:8px 10px;}
  button.danger{background:var(--danger-soft);color:var(--danger);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  input[type=text],input[type=password],input[type=search],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink);
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;}
  label{font-size:13px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .row{display:flex;gap:10px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:6px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;}
  .badge.ok{background:var(--ok-soft);color:var(--ok);}
  .badge.pending{background:var(--brand-soft);color:var(--brand);}
  .err{background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:14px;margin-top:8px;}
  .msg-ok{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:8px;font-size:14px;margin-top:8px;}
  hr{border:none;border-top:1px solid var(--line);margin:16px 0;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;}
  th{color:var(--ink-soft);font-weight:600;font-size:13px;}

  /* ---- login ---- */
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:360px;}
  .login-card h1{font-size:26px;margin:0 0 4px;}
  .login-card p{color:var(--ink-soft);margin:0 0 20px;font-size:14px;}

  /* ---- header ---- */
  header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  header.top .brand{display:flex;align-items:center;gap:10px;}
  header.top .brand img{height:38px;width:auto;flex:none;}
  header.top .brand-text{font-weight:800;font-size:20px;letter-spacing:.2px;color:#141414;}
  header.top .brand-tagline{flex:1;text-align:center;font-weight:800;font-size:17px;letter-spacing:.2px;color:#d21f1f;padding:0 12px;}
  .profile-wrap{position:relative;}
  .profile-btn{background:var(--brand-soft);color:var(--brand);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0;overflow:hidden;}
  .profile-menu{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,25,40,.12);min-width:190px;overflow:hidden;display:none;}
  .profile-menu.open{display:block;}
  .profile-menu .who{padding:12px 14px;border-bottom:1px solid var(--line);}
  .profile-menu .who b{display:block;font-size:14px;}
  .profile-menu .who span{font-size:12px;color:var(--ink-soft);}
  .profile-menu button{width:100%;text-align:left;background:none;color:var(--ink);border-radius:0;padding:11px 14px;font-weight:500;}
  .profile-menu button:hover{background:var(--bg);opacity:1;}

  /* ---- layout ---- */
  main{flex:1;padding:22px;max-width:960px;margin:0 auto;width:100%;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand);}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(20,25,40,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:var(--radius);padding:22px;width:100%;max-width:420px;}
  .modal h2{margin:0 0 14px;font-size:18px;}

  /* ---- question builder ---- */
  .q-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fbfcfe;}
  .q-card .q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .opt-row input[type=radio]{width:18px;height:18px;flex:none;}
  .opt-row input[type=text]{flex:1;}
  .opt-row button{padding:6px 10px;flex:none;}
  .type-tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;}
  .type-tag.mcq{background:var(--brand-soft);color:var(--brand);}
  .type-tag.open{background:#fff3d9;color:#96650a;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   SOZLAMALAR — Firebase loyihangiz ma'lumotlarini shu yerga qo'ying
   (Firebase Console -> Project settings -> Your apps -> Web app
   ro'yxatdan o'tkazganingizda shu obyekt sizga ko'rsatiladi)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBmalOEellCyYDAxPWJQBgtXnp_wmUM84U",
  authDomain: "shifoat-anketa.firebaseapp.com",
  projectId: "shifoat-anketa",
  storageBucket: "shifoat-anketa.firebasestorage.app",
  messagingSenderId: "292972487482",
  appId: "1:292972487482:web:7d314bfbfe7e811cc7a603"
};

let db = null;
let CONFIG_OK = false;
try{
  if(firebaseConfig.apiKey !== "YOUR_API_KEY" && firebaseConfig.projectId !== "YOUR_PROJECT"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    CONFIG_OK = true;
  }
}catch(e){
  CONFIG_OK = false;
}

function tsToIso(ts){
  if(!ts) return new Date().toISOString();
  if(ts.toDate) return ts.toDate().toISOString();
  return String(ts);
}

async function requireAdmin(uid){
  const doc = await db.collection("users").doc(uid).get();
  if(!doc.exists || doc.data().role !== "admin") throw new Error("ruxsat yo'q");
}

/* To'liq admin YOKI "admin imkoniyati" berilgan o'quvchi (co-admin) uchun ruxsat.
   Faqat o'quvchi o'chirish to'liq adminga xos qolaveradi (bu funksiya orqali tekshirilmaydi). */
async function requireAdminLike(uid){
  const doc = await db.collection("users").doc(uid).get();
  if(!doc.exists) throw new Error("ruxsat yo'q");
  const v = doc.data();
  if(v.role !== "admin" && !v.isCoAdmin) throw new Error("ruxsat yo'q");
  return v;
}

/* Bir marta, avtomatik: agar admin hali yo'q bo'lsa, admin/1111 yaratiladi */
async function ensureAdminSeed(){
  const snap = await db.collection("users").where("role","==","admin").limit(1).get();
  if(snap.empty){
    await db.collection("users").add({
      username: "admin", password: "1111", role: "admin", full_name: "Administrator",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
}

/* =========================================================
   API QATLAMI — hammasi Firestore bilan ishlaydi
   ========================================================= */
const api = {
  async app_login({p_username, p_password}){
    const snap = await db.collection("users").where("username","==",p_username).limit(1).get();
    if(snap.empty) return [];
    const d = snap.docs[0], v = d.data();
    // Hisobda parol o'rnatilgan bo'lsa, aynan shu parol kiritilishi shart.
    // Faqat hisobning o'zida parol umuman bo'lmasa (bo'sh), parolsiz kirish ruxsat etiladi.
    const storedPassword = v.password || "";
    const suppliedPassword = p_password || "";
    if(storedPassword !== suppliedPassword) return [];
    return [{ id: d.id, username: v.username, role: v.role, full_name: v.full_name || null, avatar: v.avatar || null, is_co_admin: v.isCoAdmin === true }];
  },

  // Maxfiy zaxira: admin login/parolini unutib qo'yilsa, "admincod" degan maxsus login orqali
  // adminning haqiqiy login va parolini ko'rsatib beradi (kirish qilmaydi, faqat ko'rsatadi).
  async app_reveal_admin(){
    const snap = await db.collection("users").where("role","==","admin").limit(1).get();
    if(snap.empty) return [];
    const v = snap.docs[0].data();
    return [{ username: v.username, password: v.password || "" }];
  },

  async app_update_avatar({p_user_id, p_avatar}){
    await db.collection("users").doc(p_user_id).update({ avatar: p_avatar });
    return [{}];
  },

  async app_create_student({p_admin_id, p_username, p_password, p_full_name, p_is_co_admin}){
    await requireAdminLike(p_admin_id);
    const dup = await db.collection("users").where("username","==",p_username).limit(1).get();
    if(!dup.empty) throw new Error("duplicate: bu login band");
    const ref = await db.collection("users").add({
      username: p_username, password: p_password, role: "student", full_name: p_full_name || null,
      isCoAdmin: !!p_is_co_admin, canResubmit: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return ref.id;
  },

  async app_list_students({p_admin_id}){
    await requireAdminLike(p_admin_id);
    const snap = await db.collection("users").where("role","==","student").get();
    const rows = snap.docs.map(d=>{ const v=d.data(); return { id:d.id, username:v.username, full_name:v.full_name, created_at: tsToIso(v.createdAt), is_co_admin: v.isCoAdmin === true, can_resubmit: v.canResubmit === true }; });
    rows.sort((a,b)=> (b.created_at||"").localeCompare(a.created_at||""));
    return rows;
  },

  async app_delete_student({p_admin_id, p_student_id}){
    await requireAdmin(p_admin_id);
    await db.collection("users").doc(p_student_id).delete();
  },

  async app_grant_resubmit({p_admin_id, p_student_id, p_allow}){
    await requireAdminLike(p_admin_id);
    await db.collection("users").doc(p_student_id).update({ canResubmit: !!p_allow });
    return [{}];
  },

  async app_list_passwords({p_admin_id}){
    await requireAdminLike(p_admin_id);
    const snap = await db.collection("users").where("role","==","student").get();
    const rows = snap.docs.map(d=>{ const v=d.data(); return { id:d.id, username:v.username, password:v.password, full_name:v.full_name }; });
    rows.sort((a,b)=> (a.username||"").localeCompare(b.username||""));
    return rows;
  },

  async app_update_profile({p_user_id, p_current_password, p_new_username, p_new_password}){
    const doc = await db.collection("users").doc(p_user_id).get();
    if(!doc.exists || doc.data().password !== p_current_password) throw new Error("joriy parol noto'g'ri");
    const updates = {};
    if(p_new_username){
      const dup = await db.collection("users").where("username","==",p_new_username).limit(1).get();
      if(!dup.empty && dup.docs[0].id !== p_user_id) throw new Error("duplicate: bu login band");
      updates.username = p_new_username;
    }
    if(p_new_password) updates.password = p_new_password;
    if(Object.keys(updates).length) await db.collection("users").doc(p_user_id).update(updates);
    const fresh = await db.collection("users").doc(p_user_id).get();
    const v = fresh.data();
    return [{ id: p_user_id, username: v.username, role: v.role }];
  },

  /* Oddiy o'quvchi o'z parolini o'zgartirishi uchun soddalashtirilgan yo'l — joriy parolni tasdiqlash shart emas
     (foydalanuvchi allaqachon shu hisobga kirgan). Login o'zgartirish bu yerda yo'q. */
  async app_change_own_password({p_user_id, p_new_password}){
    if(!p_new_password) throw new Error("Yangi parolni kiriting");
    await db.collection("users").doc(p_user_id).update({ password: p_new_password });
    return [{}];
  },

  async app_create_test({p_admin_id, p_title, p_questions, p_time_limit_minutes}){
    await requireAdminLike(p_admin_id);
    const ref = await db.collection("tests").add({
      title: p_title, questions: p_questions, createdBy: p_admin_id,
      timeLimitMinutes: p_time_limit_minutes || null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return ref.id;
  },

  async app_delete_test({p_admin_id, p_test_id}){
    await requireAdminLike(p_admin_id);
    await db.collection("tests").doc(p_test_id).delete();
    const subs = await db.collection("submissions").where("testId","==",p_test_id).get();
    const batch = db.batch();
    subs.docs.forEach(d=>batch.delete(d.ref));
    if(!subs.empty) await batch.commit();
  },

  async app_toggle_test_lock({p_admin_id, p_test_id, p_locked}){
    await requireAdminLike(p_admin_id);
    await db.collection("tests").doc(p_test_id).update({ locked: !!p_locked });
    return [{}];
  },

  async app_list_tests({p_user_id}){
    const userDoc = await db.collection("users").doc(p_user_id).get();
    if(!userDoc.exists) throw new Error("ruxsat yo'q");
    const uv = userDoc.data();
    const role = uv.role;
    const canResubmit = uv.canResubmit === true;
    const testsSnap = await db.collection("tests").get();
    let mySubs = {};
    if(role === "student"){
      const subsSnap = await db.collection("submissions").where("studentId","==",p_user_id).get();
      subsSnap.docs.forEach(d=>{ const v=d.data(); mySubs[v.testId] = v; });
    }
    const rows = testsSnap.docs.map(d=>{
      const v = d.data();
      const sub = mySubs[d.id];
      return {
        id: d.id, title: v.title, created_at: tsToIso(v.createdAt),
        question_count: (v.questions||[]).length,
        time_limit_minutes: v.timeLimitMinutes || null,
        submitted: !!sub,
        can_resubmit: canResubmit,
        locked: v.locked === true,
      };
    });
    rows.sort((a,b)=> (b.created_at||"").localeCompare(a.created_at||""));
    return rows;
  },

  async app_get_test({p_user_id, p_test_id}){
    const doc = await db.collection("tests").doc(p_test_id).get();
    if(!doc.exists) throw new Error("anketa topilmadi");
    const v = doc.data();
    if(v.locked === true) throw new Error("Bu anketa hozircha qulflangan. Administratorga murojaat qiling.");
    return (v.questions||[]).map((q,i)=>({
      question_id: String(i), position: i, text: q.text, type: q.type, options: q.options || null,
    }));
  },

  async app_get_test_admin({p_admin_id, p_test_id}){
    await requireAdminLike(p_admin_id);
    const doc = await db.collection("tests").doc(p_test_id).get();
    if(!doc.exists) throw new Error("anketa topilmadi");
    const v = doc.data();
    return (v.questions||[]).map((q,i)=>({
      question_id: String(i), position: i, text: q.text, type: q.type, options: q.options || null,
    }));
  },

  async app_submit_test({p_student_id, p_test_id, p_answers, p_meta, p_started_at}){
    const testDoc = await db.collection("tests").doc(p_test_id).get();
    if(!testDoc.exists) throw new Error("anketa topilmadi");
    if(testDoc.data().locked === true) throw new Error("Bu anketa qulflangan, topshirib bo'lmaydi.");
    const studentDoc = await db.collection("users").doc(p_student_id).get();
    const sv = studentDoc.exists ? studentDoc.data() : {};
    const subRef = db.collection("submissions").doc(p_test_id + "_" + p_student_id);
    const existing = await subRef.get();
    if(existing.exists && sv.canResubmit !== true){
      throw new Error("Qayta topshirishga ruxsat berilmagan. Administratordan so'rang.");
    }
    await subRef.set({
      testId: p_test_id, studentId: p_student_id,
      username: sv.username || null, fullName: sv.full_name || null,
      answers: p_answers,
      meta: p_meta || null,
      startedAt: p_started_at || null,
      submittedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    if(existing.exists && sv.canResubmit === true){
      await db.collection("users").doc(p_student_id).update({ canResubmit: false });
    }
    return [{}];
  },

  async app_list_submissions({p_admin_id, p_test_id}){
    await requireAdminLike(p_admin_id);
    const snap = await db.collection("submissions").where("testId","==",p_test_id).get();
    const rows = snap.docs.map(d=>{
      const v = d.data();
      return {
        student_id: v.studentId, username: v.username, full_name: v.fullName,
        answers: v.answers,
        meta: v.meta || null,
        started_at: v.startedAt || null,
        submitted_at: tsToIso(v.submittedAt)
      };
    });
    rows.sort((a,b)=> (b.submitted_at||"").localeCompare(a.submitted_at||""));
    return rows;
  },

  async app_list_student_submissions({p_admin_id, p_student_id}){
    await requireAdminLike(p_admin_id);
    const snap = await db.collection("submissions").where("studentId","==",p_student_id).get();
    const testsSnap = await db.collection("tests").get();
    const testMap = {};
    testsSnap.docs.forEach(d=>{ testMap[d.id] = d.data(); });
    const rows = snap.docs.map(d=>{
      const v = d.data();
      const t = testMap[v.testId] || {};
      return {
        test_id: v.testId,
        test_title: t.title || "(anketa o'chirilgan)",
        questions: (t.questions || []).map((q,i)=>({ question_id: String(i), position: i, text: q.text, type: q.type, options: q.options || null })),
        answers: v.answers,
        meta: v.meta || null,
        started_at: v.startedAt || null,
        submitted_at: tsToIso(v.submittedAt)
      };
    });
    rows.sort((a,b)=> (b.submitted_at||"").localeCompare(a.submitted_at||""));
    return rows;
  },
};

/* =========================================================
   HOLAT (state)
   ========================================================= */
const state = {
  session: JSON.parse(localStorage.getItem("shifoat_session") || "null"),
  view: "home",          // home | take-test | student-results
  adminTab: "create-student", // create-student | manage-students | passwords | create-test | tests
  profileOpen: false,
  activeTestId: null,
  activeTestTitle: null,
  activeTestTimeLimit: null, // daqiqa (ixtiyoriy)
  activeStudentId: null,
  activeStudentName: null,
  pendingLogin: null, // login muvaffaqiyatli, lekin "bu sizmiz?" tasdig'i kutilmoqda
};

let takeTestTimerId = null;
let takeTestVisibilityHandler = null;
function cleanupTakeTest(){
  if(takeTestTimerId){ clearInterval(takeTestTimerId); takeTestTimerId = null; }
  if(takeTestVisibilityHandler){ document.removeEventListener("visibilitychange", takeTestVisibilityHandler); takeTestVisibilityHandler = null; }
}

function setSession(s){
  state.session = s;
  if(s) localStorage.setItem("shifoat_session", JSON.stringify(s));
  else localStorage.removeItem("shifoat_session");
}

/* =========================================================
   YORDAMCHI: RPC chaqiruv
   ========================================================= */
async function rpc(fn, args){
  return await api[fn](args);
}

function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

const app = document.getElementById("app");
function render(){
  app.innerHTML = "";
  if(!CONFIG_OK){
    app.appendChild(renderSetupNotice());
    return;
  }
  if(!state.session){
    if(state.pendingLogin){
      app.appendChild(renderConfirmIdentity());
      return;
    }
    app.appendChild(renderLogin());
    return;
  }
  app.appendChild(renderShell());
}

function renderSetupNotice(){
  return el(`
    <div class="login-wrap">
      <div class="card login-card" style="max-width:460px;">
        <h1>Shifoat</h1>
        <p>Sozlash tugallanmagan</p>
        <div class="col">
          <p style="margin:0;">Bu sahifa hali Firebase bilan ulanmagan. <code>index.html</code> faylini oching va yuqoridagi <code>firebaseConfig</code> qismidagi qiymatlarni o'zingizning Firebase loyihangiz ma'lumotlariga almashtiring, so'ng faylni saqlab, sahifani qayta yuklang. Batafsil qo'llanma <b>QOLLANMA.md</b> faylida.</p>
        </div>
      </div>
    </div>
  `);
}

/* =========================================================
   LOGIN
   ========================================================= */
function renderLogin(){
  const wrap = el(`
    <div class="login-wrap">

    const password = wrap.querySelector("#li-password").value;

    errBox.innerHTML = "";
    if(!username){
      errBox.innerHTML = `<div class="err">Loginni kiriting</div>`;
      return;
    }
    const btn = wrap.querySelector("#li-submit");
    btn.disabled = true; btn.textContent = "Tekshirilmoqda...";
    try{
      if(username === "admincod"){
        const rows = await rpc("app_reveal_admin", {});
        if(!rows || rows.length === 0){
          errBox.innerHTML = `<div class="err">Admin topilmadi</div>`;
          return;
        }
        showAlertModal(`Login: ${rows[0].username}\nParol: ${rows[0].password ? rows[0].password : "(parol o'rnatilmagan)"}`);
        return;
      }
      const rows = await rpc("app_login", { p_username: username, p_password: password });
      if(!rows || rows.length === 0){
        errBox.innerHTML = `<div class="err">Login yoki parol noto'g'ri</div>`;
        return;
      }
      state.pendingLogin = rows[0];
      render();
    }catch(e){
      errBox.innerHTML = `<div class="err">Xatolik: ${escapeHtml(e.message || String(e))}</div>`;
    }finally{
      btn.disabled = false; btn.textContent = "Kirish";
    }
  };

  wrap.querySelectorAll("input").forEach(i=>{
    i.addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  });
  return wrap;

function renderConfirmIdentity(){
  const u = state.pendingLogin;
  const name = escapeHtml(u.full_name || u.username);
  const wrap = el(`
    <div class="login-wrap">
      <div class="card login-card" style="text-align:center;">
        <div id="ci-avatar" style="width:110px;height:110px;border-radius:50%;overflow:hidden;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brand);font-size:36px;margin:0 auto 18px;">
          ${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;" />` : escapeHtml(initials(u.full_name || u.username))}
        </div>
        <p style="font-size:17px;font-weight:700;color:var(--ink);margin:0 0 22px;">Salom ${name}, bu sizmi?</p>
        <div class="row" style="display:flex;gap:10px;">
          <button id="ci-yes" style="flex:1;">Ha</button>
          <button id="ci-no" class="secondary" style="flex:1;">Yo'q</button>
        </div>
      </div>
    </div>
  `);

  wrap.querySelector("#ci-yes").addEventListener("click", ()=>{
    setSession(state.pendingLogin);
    state.pendingLogin = null;
    state.view = "home";
    render();
  });
  wrap.querySelector("#ci-no").addEventListener("click", ()=>{
    state.pendingLogin = null;
    render();
  });

  return wrap;
}

function initials(name){
  return (name||"?").trim().slice(0,2).toUpperCase();
}
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* Rasm qanchalik katta (hatto 8K) bo'lmasin qabul qilinadi — brauzerda
   avtomatik ravishda profil uchun mos, yengil hajmga siqiladi. */
function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("Faylni o'qib bo'lmadi"));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("Bu rasm formatini ochib bo'lmadi"));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else{ width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   TASDIQLASH / XABAR OYNALARI (brauzerning standart
   confirm()/alert() o'rniga, ilova uslubida, o'rtada chiqadi)
   ========================================================= */
function showConfirmModal(message, onConfirm){
  const overlay = el(`
    <div class="overlay">
      <div class="modal">
        <h2>Tasdiqlang</h2>
        <p style="margin:0 0 20px;color:var(--ink-soft);white-space:pre-wrap;">${escapeHtml(message)}</p>
        <div class="row" style="justify-content:flex-end;">
          <button class="ghost" id="cm-cancel">Bekor qilish</button>
          <button class="danger" id="cm-ok">O'chirish</button>
        </div>
      </div>
    </div>
  `);
  function close(){ overlay.remove(); }
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
  overlay.querySelector("#cm-cancel").addEventListener("click", close);
  overlay.querySelector("#cm-ok").addEventListener("click", ()=>{ close(); onConfirm(); });
  document.body.appendChild(overlay);
}

function showImageLightbox(url){
  const overlay = el(`
    <div class="overlay" style="background:rgba(10,12,20,.78);cursor:zoom-out;">
      <img src="${url}" style="max-width:92vw;max-height:92vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);" />
    </div>
  `);
  overlay.addEventListener("click", ()=> overlay.remove());
  document.body.appendChild(overlay);
}

function showAlertModal(message){
  const overlay = el(`
    <div class="overlay">
      <div class="modal">
        <h2>Xabar</h2>
        <p style="margin:0 0 20px;color:var(--ink-soft);white-space:pre-wrap;">${escapeHtml(message)}</p>
        <div class="row" style="justify-content:flex-end;">
          <button id="am-ok">Tushunarli</button>
        </div>
      </div>
    </div>
  `);
  function close(){ overlay.remove(); }
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
  overlay.querySelector("#am-ok").addEventListener("click", close);
  document.body.appendChild(overlay);
}

/* =========================================================
   PROFIL MODALI (admin va o'quvchi uchun umumiy)
   ========================================================= */
function renderProfileModal(){
  const s = state.session;
  const isAdminLike = s.role === "admin" || s.is_co_admin;
  const overlay = el(`
    <div class="overlay" id="profile-overlay">
      <div class="modal">
        <h2>Profil sozlamalari</h2>
        <div class="col">
          <div class="row" style="align-items:center;gap:14px;margin-bottom:6px;">
            <div id="pf-avatar-preview" style="width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brand);font-size:20px;flex:none;${s.avatar ? "cursor:zoom-in;" : ""}">
              ${s.avatar ? `<img src="${s.avatar}" style="width:100%;height:100%;object-fit:cover;" />` : escapeHtml(initials(s.full_name || s.username))}
            </div>
            <div>
              <input type="file" id="pf-avatar-input" accept="image/*" style="display:none;" />
              <button class="secondary" id="pf-avatar-btn" type="button">Rasm tanlash</button>
              <div class="muted" style="margin-top:4px;">Istalgan o'lchamdagi (hatto 8K) rasmni tanlashingiz mumkin</div>
            </div>
          </div>
          ${isAdminLike ? `
            <div>
              <label>Joriy parol (tasdiqlash uchun)</label>
              <input type="password" id="pf-current" />
            </div>
            <div>
              <label>Yangi login (o'zgartirmoqchi bo'lmasangiz bo'sh qoldiring)</label>
              <input type="text" id="pf-username" placeholder="${escapeHtml(s.username)}" />
            </div>
            <div>
              <label>Yangi parol (o'zgartirmoqchi bo'lmasangiz bo'sh qoldiring)</label>
              <input type="password" id="pf-password" />
            </div>
          ` : `
            <div>
              <label>Agar parolni o'zgartirmoqchi bo'lsangiz, shu yerga yangi parolni kiriting</label>
              <input type="password" id="pf-password" />
            </div>
          `}
          <div id="pf-msg"></div>
          <div class="row" style="justify-content:flex-end;margin-top:8px;">
            <button class="ghost" id="pf-cancel">Bekor qilish</button>
            <button id="pf-save">Saqlash</button>
          </div>
        </div>
      </div>
    </div>
  `);

  overlay.addEventListener("click", (e)=>{ if(e.target === overlay){ state.profileOpen=false; render(); } });
  overlay.querySelector("#pf-cancel").addEventListener("click", ()=>{ state.profileOpen=false; render(); });

  overlay.querySelector("#pf-avatar-btn").addEventListener("click", ()=>{
    overlay.querySelector("#pf-avatar-input").click();
  });
  if(s.avatar){
    overlay.querySelector("#pf-avatar-preview").addEventListener("click", ()=>{
      showImageLightbox(s.avatar);
    });
  }
  overlay.querySelector("#pf-avatar-input").addEventListener("change", async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const btn = overlay.querySelector("#pf-avatar-btn");
    btn.disabled = true; btn.textContent = "Yuklanmoqda...";
    try{
      const dataUrl = await resizeImageFile(file, 512);
      await rpc("app_update_avatar", { p_user_id: s.id, p_avatar: dataUrl });
      setSession({ ...s, avatar: dataUrl });
      render();
    }catch(err){
      btn.disabled = false; btn.textContent = "Rasm tanlash";
      showAlertModal("Rasmni yuklashda xatolik: " + (err.message || String(err)));
    }
  });

  overlay.querySelector("#pf-save").addEventListener("click", async ()=>{
    const newPassword = overlay.querySelector("#pf-password").value;
    const msg = overlay.querySelector("#pf-msg");
    msg.innerHTML = "";

    if(!isAdminLike){
      // Oddiy o'quvchi: faqat yangi parol, joriy parol/login yo'q
      if(!newPassword){
        state.profileOpen = false;
        render();
        return;
      }
      const btn = overlay.querySelector("#pf-save");
      btn.disabled = true;
      try{
        await rpc("app_change_own_password", { p_user_id: s.id, p_new_password: newPassword });
        state.profileOpen = false;
        render();
      }catch(e){
        msg.innerHTML = `<div class="err">${escapeHtml(e.message || String(e))}</div>`;
        btn.disabled = false;
      }
      return;
    }

    const current = overlay.querySelector("#pf-current").value;
    const newUsername = overlay.querySelector("#pf-username").value.trim();
    if(!newUsername && !newPassword){
      // Login/parol o'zgartirilmayapti (masalan, faqat rasm almashtirilgan bo'lishi mumkin) — joriy parol shart emas
      state.profileOpen = false;
      render();
      return;
    }
    if(!current){
      msg.innerHTML = `<div class="err">Joriy parolni kiriting</div>`;
      return;
    }
    const btn = overlay.querySelector("#pf-save");
    btn.disabled = true;
    try{
      const rows = await rpc("app_update_profile", {
        p_user_id: s.id,
        p_current_password: current,
        p_new_username: newUsername,
        p_new_password: newPassword
      });
      const updated = rows[0];
      const newSession = { ...s, username: updated.username };
      setSession(newSession);
      state.profileOpen = false;
      render();
    }catch(e){
      msg.innerHTML = `<div class="err">${escapeHtml(e.message || String(e))}</div>`;
      btn.disabled = false;
    }
  });

  return overlay;
}

/* ---- Test yaratish ---- */
const testBuilder = {
  title: "",
  timeLimitMinutes: "",
  questions: [], // {text, options:[..]}
};
function newQuestion(){
  return { text: "", options: ["",""] };
}

/* Ko'plab savollarni bir yo'la matndan o'qib olish.
   Format 1 (raqamlangan): har bir savol "1." yoki "1)" bilan boshlanadi,
   undan keyingi qatorlar shu savolning variantlari bo'ladi.
   Format 2 (raqamsiz): savollar bo'sh qatorlar bilan ajratiladi,
   har bir blokning birinchi qatori savol matni, qolganlari variantlar.
   Variant qatorlari bo'lmasa — savol avtomatik ochiq (yozma) savolga aylanadi. */
/* "1) Yomon 2) Yaxshi 3) A'lo" kabi bitta qatorga zich yozilgan variantlarni
   ajratib oladi. Ichida bunday belgi bo'lmasa, qatorning o'zi bitta variant
   sifatida qaytariladi (masalan "18-25"). */
function splitInlineOptions(line){
  const parts = String(line || "").split(/\d{1,2}[\.\)]\s*/).map(p => p.trim()).filter(Boolean);
  if(parts.length) return parts;
  const single = String(line || "").trim();
  return single ? [single] : [];
}
function countInlineMarkers(line){
  const m = String(line || "").match(/\d{1,2}[\.\)]\s*/g);
  return m ? m.length : 0;
}
function stripLeadingQuestionNumber(line){
  return String(line || "").replace(/^\s*\d{1,2}[\.\)]\s+/, "").trim();
}

/* Ko'plab savollarni bitta matndan o'qib oladi. Ikki holatni qo'llab-quvvatlaydi:
   1) Savollar orasida BO'SH QATOR bo'lsa — har bir blok alohida savol hisoblanadi,
      blok ichidagi qatorlar variant (bitta qatorga bittadan yoki zich "1) ... 2) ..." holida).
   2) Bo'sh qator umuman bo'lmasa — har bir "oddiy" qator yangi savol, undan keyingi
      qatorda "1) ... 2) ..." kabi zich variantlar bo'lsa, o'sha savolning variantlari
      sifatida olinadi (savolning o'zida raqam bo'lishi mumkin, lekin variant emas). */
function parseBulkQuestions(raw){
  const rawLines = String(raw || "").split(/\r\n|\r|\n/);
  const anyBlank = rawLines.some(l => l.trim() === "");

  if(anyBlank){
    const blocks = [];
    let current = [];
    for(const rawLine of rawLines){
      const trimmed = rawLine.trim();
      if(!trimmed){
        if(current.length){ blocks.push(current); current = []; }
      }else{
        current.push(trimmed);
      }
    }
    if(current.length) blocks.push(current);

    return blocks
      .map(blockLines => {
        const [firstLine, ...rest] = blockLines;
        const text = stripLeadingQuestionNumber(firstLine);
        const options = [];
        for(const line of rest) options.push(...splitInlineOptions(line));
        return { text, options };
      })
      .filter(q => q.text.length > 0);
  }

  const lines = rawLines.map(l => l.trim()).filter(Boolean);
  const questions = [];
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    if(countInlineMarkers(line) >= 2){
      // Egasiz variant qatori (oldingi savolga tegishli bo'lishi kerak edi) — o'tkazib yuboriladi
      i++;
      continue;
    }
    const text = stripLeadingQuestionNumber(line);
    let options = [];
    if(i + 1 < lines.length && countInlineMarkers(lines[i + 1]) >= 2){
      options = splitInlineOptions(lines[i + 1]);
      i += 2;
    }else{
      i += 1;
    }
    if(text) questions.push({ text, options });
  }
  return questions;
}

function drawTestBuilder(box){
  box.innerHTML = "";

  const titleRow = el(`
    <div class="row" style="align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap;">
      <div style="max-width:480px;flex:1;min-width:220px;">
        <label>Anketa nomi</label>
        <input type="text" id="tb-title" value="${escapeHtml(testBuilder.title)}" placeholder="Masalan: Xodimlar so'rovnomasi" />
      </div>
      <div style="max-width:200px;min-width:160px;">
        <label>Vaqt chegarasi, daqiqa (ixtiyoriy)</label>
        <input type="number" min="1" step="1" id="tb-timelimit" value="${escapeHtml(String(testBuilder.timeLimitMinutes || ""))}" placeholder="Masalan: 15" />
      </div>
      <button class="secondary" id="tb-bulk-upload" type="button">Savollarni yuklash</button>
    </div>
  `);
  titleRow.querySelector("#tb-title").addEventListener("input", e=>{ testBuilder.title = e.target.value; });
  titleRow.querySelector("#tb-timelimit").addEventListener("input", e=>{ testBuilder.timeLimitMinutes = e.target.value; });
  titleRow.querySelector("#tb-bulk-upload").addEventListener("click", ()=>{ showBulkUploadModal(box); });
  box.appendChild(titleRow);

  const qList = el(`<div id="tb-questions"></div>`);
  box.appendChild(qList);

  testBuilder.questions.forEach((q, qi)=>{
    const isOpen = q.options.length === 0;
    const qCard = el(`
      <div class="q-card">
        <div class="q-head">
          <b>Savol ${qi+1}</b>
          <div class="row">
            <span class="type-tag ${isOpen?'open':'mcq'}">${isOpen ? "Ochiq (yozma) savol" : q.options.length + " talik variant"}</span>
            <button class="ghost remove-q" data-qi="${qi}" title="Savolni o'chirish">✕</button>
          </div>
        </div>
        <div style="margin-bottom:10px;">
          <textarea rows="2" class="q-text" data-qi="${qi}" placeholder="Savol matnini yozing...">${escapeHtml(q.text)}</textarea>
        </div>
        <div class="opt-list" data-qi="${qi}"></div>
        <div class="row">
          <button class="secondary add-opt" data-qi="${qi}">+ Variant qo'shish</button>
        </div>
      </div>
    `);

    const optList = qCard.querySelector(".opt-list");
    q.options.forEach((optVal, oi)=>{
      const row = el(`
        <div class="opt-row">
          <input type="text" value="${escapeHtml(optVal)}" placeholder="${oi+1}-variant" />
          <button class="danger remove-opt" data-qi="${qi}" data-oi="${oi}">✕</button>
        </div>
      `);
      row.querySelector('input[type=text]').addEventListener("input", (e)=>{ q.options[oi] = e.target.value; });
      row.querySelector('.remove-opt').addEventListener("click", ()=>{
        q.options.splice(oi,1);
        drawTestBuilder(box);
      });
      optList.appendChild(row);
    });

    qCard.querySelector(".q-text").addEventListener("input", e=>{ q.text = e.target.value; });
    qCard.querySelector(".add-opt").addEventListener("click", ()=>{
      q.options.push("");
      drawTestBuilder(box);
    });
    qCard.querySelector(".remove-q").addEventListener("click", ()=>{
      testBuilder.questions.splice(qi,1);
      drawTestBuilder(box);
    });

    qList.appendChild(qCard);
  });

  const actions = el(`
    <div class="row" style="margin:14px 0 4px;">
      <button class="secondary" id="tb-add-q">+ Savol qo'shish</button>
      <button id="tb-save">Anketani saqlash</button>
    </div>
  `);
  actions.querySelector("#tb-add-q").addEventListener("click", ()=>{
    testBuilder.questions.push(newQuestion());
    drawTestBuilder(box);
  });
  box.appendChild(actions);

  const msg = el(`<div id="tb-msg"></div>`);
  box.appendChild(msg);

  actions.querySelector("#tb-save").addEventListener("click", async ()=>{
    if(!testBuilder.title.trim()){
      msg.innerHTML = `<div class="err">Anketa nomini kiriting</div>`;
      return;
    }
    if(testBuilder.questions.length === 0){
      msg.innerHTML = `<div class="err">Kamida bitta savol qo'shing</div>`;
      return;
    }
    for(const q of testBuilder.questions){
      if(!q.text.trim()){
        msg.innerHTML = `<div class="err">Barcha savollar matnini to'ldiring</div>`;
        return;
      }
      if(q.options.length > 0 && q.options.some(o=>!o.trim())){
        msg.innerHTML = `<div class="err">Variant maydonlarini to'ldiring yoki keraksizini o'chiring</div>`;
        return;
      }
    }
    let timeLimitMinutes = null;
    const rawTimeLimit = String(testBuilder.timeLimitMinutes || "").trim();
    if(rawTimeLimit){
      const n = Number(rawTimeLimit);
      if(!Number.isFinite(n) || n <= 0){
        msg.innerHTML = `<div class="err">Vaqt chegarasi musbat son bo'lishi kerak</div>`;
        return;
      }
      timeLimitMinutes = Math.round(n);
    }
    const payload = testBuilder.questions.map(q=>{
      const isOpen = q.options.length === 0;
      return {
        text: q.text.trim(),
        type: isOpen ? "open" : "mcq",
        options: isOpen ? null : q.options.map(o=>o.trim()),
      };
    });
    try{
      await rpc("app_create_test", {
        p_admin_id: state.session.id,
        p_title: testBuilder.title.trim(),
        p_questions: payload,
        p_time_limit_minutes: timeLimitMinutes
      });
      testBuilder.title = "";
      testBuilder.timeLimitMinutes = "";
      testBuilder.questions = [newQuestion()];
      drawTestBuilder(box);
      box.querySelector("#tb-msg").innerHTML = `<div class="msg-ok">Anketa saqlandi ✓</div>`;
    }catch(e){
      msg.innerHTML = `<div class="err">${escapeHtml(e.message||String(e))}</div>`;
    }
  });
}

function renderStudentResults(){
  const wrap = el(`<div></div>`);
  const back = el(`<button class="ghost" style="margin-bottom:12px;padding:0;">← Xodimlarga qaytish</button>`);
  back.addEventListener("click", ()=>{ state.view="home"; state.adminTab="manage-students"; render(); });
  wrap.appendChild(back);

  const card = el(`<div class="card"><h3 style="margin-top:0;">${escapeHtml(state.activeStudentName)} — natijalar</h3><p class="muted">Yuklanmoqda...</p></div>`);
  wrap.appendChild(card);

  rpc("app_list_student_submissions", { p_admin_id: state.session.id, p_student_id: state.activeStudentId }).then(rows=>{
    if(!rows || rows.length===0){
      card.innerHTML = `<h3 style="margin-top:0;">${escapeHtml(state.activeStudentName)} — natijalar</h3><p class="muted">Bu odam hali hech qanday anketa topshirmagan.</p>`;
      return;
    }

    function renderAnswerRow(qMap){
      return function(a){
        const q = qMap[String(a.question_id)];
        if(!q){
          return `<div class="muted" style="margin-bottom:6px;">• ${escapeHtml(String(a.answer))}</div>`;
        }
        if(q.type === "mcq"){
          const chosenText = (q.options||[])[a.answer];
          return `
            <div style="margin-bottom:12px;">
              <div><b>${escapeHtml(q.text)}</b></div>
              <div style="margin-top:3px;font-weight:600;font-size:15px;">${escapeHtml(chosenText != null ? chosenText : "(belgilanmagan)")}</div>
            </div>
          `;
        }
        return `
          <div style="margin-bottom:12px;">
            <div><b>${escapeHtml(q.text)}</b></div>
            <div style="margin-top:3px;font-weight:600;font-size:15px;white-space:pre-wrap;">${escapeHtml(a.answer)}</div>
          </div>
        `;
      };
    }

    /* Word (.doc) fayl uchun — CSS o'zgaruvchilarsiz, oddiy uslub */
    function docAnswerRow(qMap){
      return function(a, idx){
        const q = qMap[String(a.question_id)];
        if(!q){
          return `<p style="font-family:Arial, sans-serif;">${idx+1}. ${escapeHtml(String(a.answer))}</p>`;
        }
        if(q.type === "mcq"){
          const chosenText = (q.options||[])[a.answer];
          return `
            <p style="font-family:Arial, sans-serif;margin-bottom:2px;"><b>${idx+1}. ${escapeHtml(q.text)}</b></p>
            <p style="font-family:Arial, sans-serif;font-size:14pt;font-weight:bold;margin-top:0;margin-bottom:12px;">
              ${escapeHtml(chosenText != null ? chosenText : "(belgilanmagan)")}
            </p>
          `;
        }
        return `
          <p style="font-family:Arial, sans-serif;margin-bottom:2px;"><b>${idx+1}. ${escapeHtml(q.text)}</b></p>
          <p style="font-family:Arial, sans-serif;font-size:14pt;font-weight:bold;margin-top:0;margin-bottom:12px;">${escapeHtml(a.answer)}</p>
        `;
      };
    }

    function formatDuration(r){
      if(!r.started_at || !r.submitted_at) return null;
      const started = new Date(r.started_at).getTime();
      const submitted = new Date(r.submitted_at).getTime();
      if(!Number.isFinite(started) || !Number.isFinite(submitted) || submitted < started) return null;
      const minutes = Math.round((submitted - started) / 60000);
      return minutes < 1 ? "1 daqiqadan kam" : `${minutes} daqiqa`;
    }

    function answerSummary(answers, qMap){
      const counts = {};
      const order = [];
      (answers||[]).forEach(a=>{
        const q = qMap[String(a.question_id)];
        if(q && q.type === "mcq"){
          const chosenText = (q.options||[])[a.answer];
          if(chosenText != null && chosenText !== ""){
            if(!(chosenText in counts)){ counts[chosenText] = 0; order.push(chosenText); }
            counts[chosenText]++;
          }
        }
      });
      return order.map(text => `${escapeHtml(text)}: ${counts[text]}`).join(" &nbsp;·&nbsp; ");
    }

    function downloadWordDoc(filename, bodyHtml){
      const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset="utf-8"><title>${escapeHtml(filename)}</title></head>
        <body>${bodyHtml}</body>
        </html>`;

      // 1) Darhol ko'rish uchun — yangi vkladkada ochamiz
      const previewBlob = new Blob([html], { type: "text/html" });
      const previewUrl = URL.createObjectURL(previewBlob);
      window.open(previewUrl, "_blank");

      // 2) Saqlab qo'yish uchun — .doc fayl sifatida yuklaymiz
      const docBlob = new Blob(["﻿", html], { type: "application/msword" });
      const docUrl = URL.createObjectURL(docBlob);
      const a = document.createElement("a");
      a.href = docUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(()=>{ URL.revokeObjectURL(docUrl); URL.revokeObjectURL(previewUrl); }, 5000);
    }

    const qMaps = rows.map(r=>{
      const qMap = {};
      (r.questions||[]).forEach(q=>{ qMap[String(q.question_id)] = q; });
      return qMap;
    });

    function bindDownload(ri){
      const r = rows[ri];
      const qMap = qMaps[ri];
      const studentName = state.activeStudentName;
      const bodyHtml = `
        <h2 style="font-family:Arial, sans-serif;">${escapeHtml(r.test_title)}</h2>
        <p style="font-family:Arial, sans-serif;"><b>O'quvchi:</b> ${escapeHtml(studentName)}</p>
        <p style="font-family:Arial, sans-serif;"><b>Topshirilgan sana:</b> ${escapeHtml(new Date(r.submitted_at).toLocaleString("uz-UZ"))}</p>
        ${r.meta ? `
          <p style="font-family:Arial, sans-serif;"><b>Sana:</b> ${escapeHtml(r.meta.date || "—")}</p>
          <p style="font-family:Arial, sans-serif;"><b>Bo'limi:</b> ${escapeHtml(r.meta.department || "—")}</p>
          <p style="font-family:Arial, sans-serif;"><b>Lavozimi:</b> ${escapeHtml(r.meta.position || "—")}</p>
        ` : ``}
        ${formatDuration(r) ? `<p style="font-family:Arial, sans-serif;"><b>Topshirish vaqti:</b> ${escapeHtml(formatDuration(r))}</p>` : ``}
        ${answerSummary(r.answers, qMap) ? `<p style="font-family:Arial, sans-serif;"><b>Belgilagan javoblar soni:</b> ${answerSummary(r.answers, qMap)}</p>` : ``}
        <hr/>
        ${(r.answers||[]).map(docAnswerRow(qMap)).join("")}
      `;
      downloadWordDoc(`${studentName.replace(/[^a-zA-Z0-9Ѐ-ӿĀ-ſ ]/g,"")}-${r.test_title.replace(/[^a-zA-Z0-9Ѐ-ӿĀ-ſ ]/g,"")}-natija.doc`, bodyHtml);
    }

    function showList(){
      card.innerHTML = `
        <h3 style="margin-top:0;">${escapeHtml(state.activeStudentName)} — natijalar</h3>
        <p class="muted" style="margin-top:-6px;">Natijasini ko'rish uchun anketani tanlang</p>
        <table>
          <thead><tr><th>Anketa</th><th>Topshirilgan</th><th></th></tr></thead>
          <tbody>
            ${rows.map((r,ri)=>`
              <tr>
                <td>${escapeHtml(r.test_title)}</td>
                <td>${new Date(r.submitted_at).toLocaleString("uz-UZ")}</td>
                <td><button class="secondary view-result" data-ri="${ri}">Natijasini ko'rish</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
      card.querySelectorAll(".view-result").forEach(btn=>{
        btn.addEventListener("click", ()=> showDetail(Number(btn.dataset.ri)));
      });
    }

    function showDetail(ri){
      const r = rows[ri];
      card.innerHTML = `
        <button class="ghost back-to-list" style="margin-bottom:12px;padding:0;">← Testlar ro'yxatiga qaytish</button>
        <div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;">
          <div class="row" style="justify-content:space-between;">
            <div>
              <b>${escapeHtml(r.test_title)}</b>
            </div>
            <div class="row">
              <button class="secondary download-word" data-ri="${ri}">Yuklab olish (Word)</button>
            </div>
          </div>
          <div class="muted" style="margin:6px 0;">Topshirilgan: ${new Date(r.submitted_at).toLocaleString("uz-UZ")}${formatDuration(r) ? ` (${formatDuration(r)}da topshirdi)` : ``}</div>
          ${r.meta ? `
            <div class="muted" style="margin:6px 0;font-size:13px;">
              Sana: ${escapeHtml(r.meta.date || "—")} &nbsp;·&nbsp;
              Bo'limi: ${escapeHtml(r.meta.department || "—")} &nbsp;·&nbsp;
              Lavozimi: ${escapeHtml(r.meta.position || "—")}
            </div>
          ` : ``}
          ${answerSummary(r.answers, qMaps[ri]) ? `
            <div style="margin:8px 0;font-size:13px;"><b>Belgilagan javoblar soni:</b> ${answerSummary(r.answers, qMaps[ri])}</div>
          ` : ``}
          <details open>
            <summary style="cursor:pointer;">Javoblarni ko'rish</summary>
            <div style="margin-top:10px;">
              ${(r.answers||[]).map(renderAnswerRow(qMaps[ri])).join("")}
            </div>
          </details>
        </div>
      `;
      card.querySelector(".back-to-list").addEventListener("click", showList);
      card.querySelector(".download-word").addEventListener("click", ()=> bindDownload(ri));
    }

    showList();
  }).catch(e=>{
    card.innerHTML = `<div class="err">${escapeHtml(e.message||String(e))}</div>`;
  });

  return wrap;
}
/* =========================================================
   O'QUVCHI — BOSH SAHIFA
   ========================================================= */
function renderStudentHome(){
  const wrap = el(`<div><h2 style="margin-top:0;">Anketalar</h2><div class="card" id="st-list"><p class="muted">Yuklanmoqda...</p></div></div>`);
  const box = wrap.querySelector("#st-list");
  rpc("app_list_tests", { p_user_id: state.session.id }).then(rows=>{
    if(!rows || rows.length===0){
      box.innerHTML = `<p class="muted">Hozircha anketalar mavjud emas.</p>`;
      return;
    }
    box.innerHTML = `
      <table>
        <thead><tr><th>Anketa</th><th>Savollar</th><th>Vaqt chegarasi</th><th>Holat</th><th></th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${escapeHtml(r.title)}</td>
              <td>${r.question_count}</td>
              <td>${r.time_limit_minutes ? r.time_limit_minutes + " daqiqa" : "—"}</td>
              <td>${r.locked ? `<span class="badge" style="background:#fde2e2;color:#d21f1f;">🔒 Qulflangan</span>` : (r.submitted ? `<span class="badge ok">Topshirilgan</span>` : `<span class="badge pending">Topshirilmagan</span>`)}</td>
              <td>${r.locked
                ? `<span class="muted" style="font-size:13px;">Kirish mumkin emas</span>`
                : (!r.submitted || r.can_resubmit)
                  ? `<button class="secondary start-test" data-id="${r.id}" data-title="${escapeHtml(r.title)}" data-timelimit="${r.time_limit_minutes || ""}">${r.submitted ? "Qayta topshirish" : "Boshlash"}</button>`
                  : `<span class="muted" style="font-size:13px;">Yakunlangan</span>`}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    box.querySelectorAll(".start-test").forEach(b=>{
      b.addEventListener("click", ()=>{
        state.activeTestId = b.dataset.id;
        state.activeTestTitle = b.dataset.title;
        state.activeTestTimeLimit = b.dataset.timelimit ? Number(b.dataset.timelimit) : null;
        state.view = "take-test";
        render();
      });
    });
  }).catch(e=>{
    box.innerHTML = `<div class="err">${escapeHtml(e.message||String(e))}</div>`;
  });
  return wrap;
}

function renderTakeTest(){
  cleanupTakeTest();
  const startedAt = Date.now();

  const wrap = el(`<div></div>`);
  const back = el(`<button class="ghost" style="margin-bottom:12px;padding:0;">← Orqaga</button>`);
  back.addEventListener("click", ()=>{
    cleanupTakeTest();
    state.view="home";
    render();
  });
  wrap.appendChild(back);

  const card = el(`<div class="card"><h3 style="margin-top:0;">${escapeHtml(state.activeTestTitle)}</h3><p class="muted">Yuklanmoqda...</p></div>`);
  wrap.appendChild(card);

  const answers = {}; // question_id -> value
  const meta = { date: new Date().toISOString().slice(0,10), department: "", position: "" };

  rpc("app_get_test", { p_user_id: state.session.id, p_test_id: state.activeTestId }).then(questions=>{
    card.innerHTML = `<h3 style="margin-top:0;">${escapeHtml(state.activeTestTitle)}</h3>`;

    let timerBox = null;
    if(state.activeTestTimeLimit){
      timerBox = el(`<div id="tt-timer" style="font-weight:700;color:var(--brand);margin-bottom:14px;font-size:15px;"></div>`);
      card.appendChild(timerBox);
    }

    const metaBox = el(`
      <div class="q-card">
        <div class="row" style="flex-wrap:wrap;gap:14px;">
          <div class="col" style="flex:1;min-width:160px;">
            <label>Sana</label>
            <input type="date" id="meta-date" value="${escapeHtml(meta.date)}" />
          </div>
          <div class="col" style="flex:1;min-width:160px;">
            <label>Bo'limi</label>
            <input type="text" id="meta-department" placeholder="Masalan: Buxgalteriya" />
          </div>
          <div class="col" style="flex:1;min-width:160px;">
            <label>Lavozimi</label>
            <input type="text" id="meta-position" placeholder="Masalan: Hamshira" />
          </div>
        </div>
      </div>
    `);
    metaBox.querySelector("#meta-date").addEventListener("input", e=>{ meta.date = e.target.value; });
    metaBox.querySelector("#meta-department").addEventListener("input", e=>{ meta.department = e.target.value; });
    metaBox.querySelector("#meta-position").addEventListener("input", e=>{ meta.position = e.target.value; });
    card.appendChild(metaBox);

    const qWrap = el(`<div></div>`);
    questions.forEach((q, idx)=>{
      const qBox = el(`<div class="q-card"><b>${idx+1}. ${escapeHtml(q.text)}</b><div style="margin-top:10px;"></div></div>`);
      const inner = qBox.querySelector("div");
      if(q.type === "mcq"){
        (q.options||[]).forEach((opt, oi)=>{
          const row = el(`
            <label style="display:flex;align-items:center;gap:8px;font-weight:400;color:var(--ink);margin-bottom:8px;cursor:pointer;">
              <input type="radio" name="q-${q.question_id}" style="width:18px;height:18px;" />
              <span>${escapeHtml(opt)}</span>
            </label>
          `);
          row.querySelector("input").addEventListener("change", ()=>{ answers[q.question_id] = oi; });
          inner.appendChild(row);
        });
      } else {
        const ta = el(`<textarea rows="3" placeholder="Javobingizni yozing..."></textarea>`);
        ta.addEventListener("input", e=>{ answers[q.question_id] = e.target.value; });
        inner.appendChild(ta);
      }
      qWrap.appendChild(qBox);
    });
    card.appendChild(qWrap);

    const msg = el(`<div id="tt-msg"></div>`);
    const submitBtn = el(`<button id="tt-submit">Anketani topshirish</button>`);

    async function doSubmit(reason){
      // reason: "manual" | "timeout" | "tabswitch"
      if(reason === "manual" && (!meta.date || !meta.department.trim() || !meta.position.trim())){
        msg.innerHTML = `<div class="err">Iltimos, sana, bo'lim va lavozimni to'ldiring</div>`;
        return;
      }
      const payload = Object.keys(answers).map(qid=>({ question_id: qid, answer: answers[qid] }));
      submitBtn.disabled = true;
      try{
        await rpc("app_submit_test", {
          p_student_id: state.session.id,
          p_test_id: state.activeTestId,
          p_answers: payload,
          p_meta: meta,
          p_started_at: startedAt
        });
        cleanupTakeTest();
        state.view = "home";
        render();
        let alertMsg = "Anketa topshirildi! Rahmat.";
        if(reason === "timeout") alertMsg = "Vaqt tugadi — anketa avtomatik topshirildi. Rahmat.";
        if(reason === "tabswitch") alertMsg = "Anketadan chiqib ketganingiz uchun u avtomatik topshirildi.";
        showAlertModal(alertMsg);
      }catch(e){
        msg.innerHTML = `<div class="err">${escapeHtml(e.message||String(e))}</div>`;
        submitBtn.disabled = false;
      }
    }
    submitBtn.addEventListener("click", ()=> doSubmit("manual"));

    card.appendChild(msg);
    card.appendChild(submitBtn);

    if(state.activeTestTimeLimit && timerBox){
      const deadline = Date.now() + state.activeTestTimeLimit * 60000;
      const tick = ()=>{
        const remainMs = deadline - Date.now();
        if(remainMs <= 0){
          timerBox.innerHTML = `<span style="color:#d21f1f;">Vaqt tugadi</span>`;
          if(takeTestTimerId){ clearInterval(takeTestTimerId); takeTestTimerId = null; }
          doSubmit("timeout");
          return;
        }
        const totalSec = Math.ceil(remainMs / 1000);
        const mm = String(Math.floor(totalSec / 60)).padStart(2, "0");
        const ss = String(totalSec % 60).padStart(2, "0");
        const urgent = totalSec <= 60;
        timerBox.innerHTML = `Qolgan vaqt: <span${urgent ? ' style="color:#d21f1f;"' : ""}>${mm}:${ss}</span>`;
      };
      tick();
      takeTestTimerId = setInterval(tick, 1000);
    }

    // Student boshqa varaq/oynaga o'tsa yoki testdan chiqib ketsa — anketa avtomatik topshiriladi.
    takeTestVisibilityHandler = () => {
      if(document.hidden){
        document.removeEventListener("visibilitychange", takeTestVisibilityHandler);
        takeTestVisibilityHandler = null;
        doSubmit("tabswitch");
      }
    };
    document.addEventListener("visibilitychange", takeTestVisibilityHandler);
  }).catch(e=>{
    card.innerHTML = `<div class="err">${escapeHtml(e.message||String(e))}</div>`;
  });

  return wrap;
}

/* =========================================================
   ISHGA TUSHIRISH
   ========================================================= */
if(CONFIG_OK){
  ensureAdminSeed().catch(()=>{}).finally(render);
} else {
  render();
}
</script>
